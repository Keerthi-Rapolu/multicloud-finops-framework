name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

      - name: Smoke — generate synthetic data
        run: python load_synthetic.py --month 2026-03 --scenario normal --force

      - name: Run dbt models
        working-directory: dbt_project
        run: |
          dbt run --profiles-dir . --vars "data_root: ${{ github.workspace }}/data"

      - name: Run dbt tests
        working-directory: dbt_project
        run: |
          dbt test --profiles-dir . --vars "data_root: ${{ github.workspace }}/data"

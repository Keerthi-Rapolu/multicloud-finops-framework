name: 'multicloud_finops'
version: '1.0.0'
config-version: 2

profile: 'multicloud_finops'

model-paths:   ["models"]
seed-paths:    ["seeds"]
macro-paths:   ["macros"]
target-path:   "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Absolute path to repo data/ folder.
  # Override per-machine: dbt run --vars '{"data_root": "/your/path/to/data"}'
  data_root: "C:/Users/rapol/Downloads/multicloud-finops-framework/data"

models:
  multicloud_finops:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
